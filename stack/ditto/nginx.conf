# Derived from eclipse-ditto/ditto deployment/docker/nginx.conf (EPL-2.0).
# Changes: swagger-ui/apidoc and landing page removed; /models/ serves the WoT Type library.
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  types {
    application/tm+json tm.jsonld;
  }
  charset utf-8;
  default_type application/json;
  server_tokens off;

  proxy_connect_timeout 70;
  proxy_send_timeout 70;
  proxy_read_timeout 70;
  send_timeout 70;
  client_header_buffer_size 8k;
  large_client_header_buffers 4 16k;
  merge_slashes off;

  server {
    listen 80;
    server_name localhost phm-models;

    location = / {
      return 302 /ui/;
    }

    # WoT Thing Models (Type library), read-only, no auth: fetched by Ditto things service.
    location /models/ {
      include nginx-cors.conf;
      alias /usr/share/nginx/models/;
      autoindex on;
    }

    # Connections API: authenticated by Ditto gateway with devops credentials.
    location /api/2/connections {
      include nginx-cors.conf;
      proxy_pass                    http://gateway:8080;
      proxy_http_version            1.1;
      proxy_set_header              Host                $http_host;
      proxy_set_header              X-Real-IP           $remote_addr;
      proxy_set_header              X-Forwarded-For     $proxy_add_x_forwarded_for;
      proxy_set_header              X-Forwarded-User    $remote_user;
      proxy_set_header Connection  '';
      chunked_transfer_encoding    off;
      proxy_buffering              off;
      proxy_cache                  off;
    }

    location /api {
      include nginx-cors.conf;
      auth_basic                    "Authentication required";
      auth_basic_user_file          nginx.htpasswd;
      proxy_pass                    http://gateway:8080;
      proxy_http_version            1.1;
      proxy_set_header              Host                      $http_host;
      proxy_set_header              X-Real-IP                 $remote_addr;
      proxy_set_header              X-Forwarded-For           $proxy_add_x_forwarded_for;
      proxy_set_header              X-Forwarded-User          $remote_user;
      proxy_set_header              x-ditto-pre-authenticated "nginx:${remote_user}";
      proxy_set_header Connection  '';
      chunked_transfer_encoding    off;
      proxy_buffering              off;
      proxy_cache                  off;
    }

    location /ws {
      auth_basic                    "Restricted";
      auth_basic_user_file          nginx.htpasswd;
      proxy_pass                    http://gateway:8080;
      proxy_http_version            1.1;
      proxy_set_header              Host                      $http_host;
      proxy_set_header              X-Real-IP                 $remote_addr;
      proxy_set_header              X-Forwarded-For           $proxy_add_x_forwarded_for;
      proxy_set_header              X-Forwarded-User          $remote_user;
      proxy_set_header              x-ditto-pre-authenticated "nginx:${remote_user}";
      proxy_set_header              Upgrade             $http_upgrade;
      proxy_set_header              Connection          "upgrade";
      proxy_read_timeout            1d;
      proxy_send_timeout            1d;
    }

    location /health {
      include nginx-cors.conf;
      proxy_pass                    http://gateway:8080;
      proxy_http_version            1.1;
      proxy_set_header              Host                $http_host;
    }

    location /status {
      include nginx-cors.conf;
      proxy_pass                    http://gateway:8080/overall/status;
      proxy_http_version            1.1;
      proxy_set_header              Host                $http_host;
    }

    location /devops {
      include nginx-cors.conf;
      proxy_pass                    http://gateway:8080;
      proxy_http_version            1.1;
      proxy_set_header              Host                $http_host;
    }

    location /ui/ {
      proxy_pass                    http://ditto-ui:8080/;
      proxy_http_version            1.1;
      proxy_set_header              Host                $http_host;
    }
  }
}
