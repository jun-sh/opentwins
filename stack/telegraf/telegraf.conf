# Raw path: phm/raw/<thing_id>/<feature_id>  payload {"samples":[{"ts":<unix_us>,"<property>":<number>,...}]}
# Field names are the WoT TM property names; tags thing_id/feature_id equal the Ditto IDs.

[agent]
  interval = "1s"
  flush_interval = "1s"
  metric_batch_size = 5000
  # In-memory buffer: ~100 s of one G1 (~30k metrics/s) across an InfluxDB outage, ~1-2 GB RAM.
  # Do NOT switch to buffer_strategy = "disk": its WAL cannot sustain G1 rates, the output falls
  # behind, mqtt_consumer stalls on max_undelivered_messages, paho misses PINGRESP and mosquitto
  # drops ~75% of the raw stream (measured 2026-11-23).
  metric_buffer_limit = 3000000
  buffer_strategy = "memory"
  omit_hostname = true

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["phm/raw/#"]
  topic_tag = ""
  qos = 0
  client_id = "telegraf-phm-raw"
  # One message = one joint batch (~200 metrics). 10000 x 200 = 2M metrics in flight, below
  # metric_buffer_limit, so short InfluxDB stalls are absorbed instead of blocking the MQTT reader.
  max_undelivered_messages = 10000
  username = "telegraf"
  password = "${MQTT_TELEGRAF_PASSWORD}"
  data_format = "json_v2"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "phm/raw/+/+"
    tags = "_/_/thing_id/feature_id"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "telemetry"
    [[inputs.mqtt_consumer.json_v2.object]]
      path = "samples"
      timestamp_key = "ts"
      timestamp_format = "unix_us"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "phm"
  bucket = "raw"
