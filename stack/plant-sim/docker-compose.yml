# P4 plant simulation: OPC UA pump-set simulator + Telegraf OPC UA -> MQTT bridge.
# Separate compose project ("phm-plant") on the main stack's network; never touches the core services.
#   docker-compose -p phm-plant --env-file ../.env up -d --build
# Configs are baked into the images (no bind mounts), so a running instance does not depend on this checkout.

services:
  pump-sim:
    build: { context: ., dockerfile: Dockerfile.sim }
    image: phm-plant/pump-sim:0.1.0
    restart: unless-stopped
    environment:
      SIM_BEARING_WEAR: ${SIM_BEARING_WEAR:-0}
      SIM_BEARING_WEAR_RATE: ${SIM_BEARING_WEAR_RATE:-0.5}
      SIM_TIME_SCALE: ${SIM_TIME_SCALE:-1}
    ports:
      - "${PHM_BIND:-127.0.0.1}:${PHM_OPCUA_PORT:-14840}:4840"   # for OPC UA clients (UaExpert etc.)
    logging: { options: { max-size: 10m } }

  telegraf-opcua:
    build: { context: ., dockerfile: Dockerfile.telegraf }
    image: phm-plant/telegraf-opcua:0.1.0
    restart: unless-stopped
    environment:
      OPCUA_ENDPOINT: opc.tcp://pump-sim:4840/plant-sim/
      MQTT_EDGE_PASSWORD: ${MQTT_EDGE_PASSWORD:?needs ../.env}
    depends_on: [pump-sim]
    logging: { options: { max-size: 10m } }

networks:
  default:
    name: phm_default
    external: true
