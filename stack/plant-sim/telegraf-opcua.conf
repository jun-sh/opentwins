# OPC UA -> MQTT edge contract (stack/README.md), configuration only.
#   one [[inputs.opcua.group]] per Ditto Feature: metric name = feature, tags thing_id/feature_id,
#   field name = WoT TM property name. This file IS the OPC UA "adapter" for plant.sim:pump-set-01.
#   raw   : 10 Hz poll  -> phm/raw/<thing_id>/<feature_id>, batched once per second
#   state : 1 Hz poll   -> phm/state/<thing_id>, Ditto merge on /features (alarms -> controller.faultCodes)
# The node list appears twice (raw/state polls): Telegraf aggregators cannot be chained, so a separate
# 1 Hz input is the config-only way to get a 1 Hz state stream.

[agent]
  interval = "100ms"
  flush_interval = "1s"
  metric_batch_size = 2000
  metric_buffer_limit = 50000
  omit_hostname = true
  skip_processors_after_aggregators = true

[[inputs.opcua]]
  alias = "raw"
  name = "plant-sim"
  endpoint = "${OPCUA_ENDPOINT}"
  security_policy = "None"
  security_mode = "None"
  auth_method = "Anonymous"
  connect_timeout = "10s"
  request_timeout = "5s"
  timestamp = "gather"
  # Telegraf adds a per-node "Quality" field; twin and raw store take TM properties only.
  # Per-node "Quality" field and "id" tag are dropped so the nodes of a group merge into one metric.
  fieldexclude = ["Quality*"]
  tagexclude = ["id"]

  [[inputs.opcua.group]]
    name = "motor"
    namespace = "2"
    identifier_type = "s"
    default_tags = { thing_id = "plant.sim:pump-set-01", feature_id = "motor" }
    nodes = [
      { name = "velocity",           identifier = "PumpSet01.Motor.Speed" },
      { name = "current",            identifier = "PumpSet01.Motor.StatorCurrent" },
      { name = "torque",             identifier = "PumpSet01.Motor.Torque" },
      { name = "windingTemperature", identifier = "PumpSet01.Motor.WindingTemperature" },
      { name = "faultCode",          identifier = "PumpSet01.Motor.AlarmWord" },
    ]

  [[inputs.opcua.group]]
    name = "bearing_de"
    namespace = "2"
    identifier_type = "s"
    default_tags = { thing_id = "plant.sim:pump-set-01", feature_id = "bearing_de" }
    nodes = [
      { name = "vibrationRms",  identifier = "PumpSet01.BearingDE.VibrationRms" },
      { name = "vibrationPeak", identifier = "PumpSet01.BearingDE.VibrationPeak" },
      { name = "temperature",   identifier = "PumpSet01.BearingDE.Temperature" },
    ]

  [[inputs.opcua.group]]
    name = "bearing_nde"
    namespace = "2"
    identifier_type = "s"
    default_tags = { thing_id = "plant.sim:pump-set-01", feature_id = "bearing_nde" }
    nodes = [
      { name = "vibrationRms",  identifier = "PumpSet01.BearingNDE.VibrationRms" },
      { name = "vibrationPeak", identifier = "PumpSet01.BearingNDE.VibrationPeak" },
      { name = "temperature",   identifier = "PumpSet01.BearingNDE.Temperature" },
    ]

  [[inputs.opcua.group]]
    name = "pump"
    namespace = "2"
    identifier_type = "s"
    default_tags = { thing_id = "plant.sim:pump-set-01", feature_id = "pump" }
    nodes = [
      { name = "flow",              identifier = "PumpSet01.Pump.Flow" },
      { name = "suctionPressure",   identifier = "PumpSet01.Pump.SuctionPressure" },
      { name = "dischargePressure", identifier = "PumpSet01.Pump.DischargePressure" },
    ]

[[inputs.opcua]]
  alias = "state"
  interval = "1s"
  name_suffix = "_state"
  name = "plant-sim"
  endpoint = "${OPCUA_ENDPOINT}"
  security_policy = "None"
  security_mode = "None"
  auth_method = "Anonymous"
  connect_timeout = "10s"
  request_timeout = "5s"
  timestamp = "gather"
  # Telegraf adds a per-node "Quality" field; twin and raw store take TM properties only.
  # Per-node "Quality" field and "id" tag are dropped so the nodes of a group merge into one metric.
  fieldexclude = ["Quality*"]
  tagexclude = ["id"]

  [[inputs.opcua.group]]
    name = "motor"
    namespace = "2"
    identifier_type = "s"
    default_tags = { thing_id = "plant.sim:pump-set-01", feature_id = "motor" }
    nodes = [
      { name = "velocity",           identifier = "PumpSet01.Motor.Speed" },
      { name = "current",            identifier = "PumpSet01.Motor.StatorCurrent" },
      { name = "torque",             identifier = "PumpSet01.Motor.Torque" },
      { name = "windingTemperature", identifier = "PumpSet01.Motor.WindingTemperature" },
      { name = "faultCode",          identifier = "PumpSet01.Motor.AlarmWord" },
    ]

  [[inputs.opcua.group]]
    name = "bearing_de"
    namespace = "2"
    identifier_type = "s"
    default_tags = { thing_id = "plant.sim:pump-set-01", feature_id = "bearing_de" }
    nodes = [
      { name = "vibrationRms",  identifier = "PumpSet01.BearingDE.VibrationRms" },
      { name = "vibrationPeak", identifier = "PumpSet01.BearingDE.VibrationPeak" },
      { name = "temperature",   identifier = "PumpSet01.BearingDE.Temperature" },
    ]

  [[inputs.opcua.group]]
    name = "bearing_nde"
    namespace = "2"
    identifier_type = "s"
    default_tags = { thing_id = "plant.sim:pump-set-01", feature_id = "bearing_nde" }
    nodes = [
      { name = "vibrationRms",  identifier = "PumpSet01.BearingNDE.VibrationRms" },
      { name = "vibrationPeak", identifier = "PumpSet01.BearingNDE.VibrationPeak" },
      { name = "temperature",   identifier = "PumpSet01.BearingNDE.Temperature" },
    ]

  [[inputs.opcua.group]]
    name = "pump"
    namespace = "2"
    identifier_type = "s"
    default_tags = { thing_id = "plant.sim:pump-set-01", feature_id = "pump" }
    nodes = [
      { name = "flow",              identifier = "PumpSet01.Pump.Flow" },
      { name = "suctionPressure",   identifier = "PumpSet01.Pump.SuctionPressure" },
      { name = "dischargePressure", identifier = "PumpSet01.Pump.DischargePressure" },
    ]

  [[inputs.opcua.group]]
    name = "controller"
    namespace = "2"
    identifier_type = "s"
    default_tags = { thing_id = "plant.sim:pump-set-01", feature_id = "controller" }
    nodes = [
      { name = "mode",             identifier = "PumpSet01.Controller.Mode" },
      { name = "VibrationHigh",    identifier = "PumpSet01.Alarms.VibrationHigh" },
      { name = "VibrationTrip",    identifier = "PumpSet01.Alarms.VibrationTrip" },
      { name = "BearingTempHigh",  identifier = "PumpSet01.Alarms.BearingTempHigh" },
      { name = "WindingTempHigh",  identifier = "PumpSet01.Alarms.WindingTempHigh" },
      { name = "FlowLow",          identifier = "PumpSet01.Alarms.FlowLow" },
      { name = "MotorOvercurrent", identifier = "PumpSet01.Alarms.MotorOvercurrent" },
    ]

# opcua emits one metric per node; merge the nodes of a feature (same name, tags, gather time) into one.
[[aggregators.merge]]
  period = "1s"
  drop_original = true

# Raw: scalar TM properties only (alarm booleans/mode go to the twin; the alarm word is motor.faultCode).
[[outputs.mqtt]]
  alias = "phm-raw"
  namepass = ["motor", "bearing_de", "bearing_nde", "pump"]
  servers = ["tcp://mosquitto:1883"]
  protocol = "3.1.1"
  client_id = "telegraf-opcua-raw"
  username = "edge"
  password = "${MQTT_EDGE_PASSWORD}"
  qos = 0
  topic = 'phm/raw/{{ .Tag "thing_id" }}/{{ .Tag "feature_id" }}'
  layout = "batch"
  data_format = "json"
  json_timestamp_units = "1us"
  json_transformation = '''
    {"samples": [metrics.$merge([{"ts": timestamp}, fields])]}
  '''

# State: one Ditto Protocol merge per feature per second.
[[outputs.mqtt]]
  alias = "phm-state"
  namepass = ["*_state"]
  servers = ["tcp://mosquitto:1883"]
  protocol = "3.1.1"
  client_id = "telegraf-opcua-state"
  username = "edge"
  password = "${MQTT_EDGE_PASSWORD}"
  qos = 0
  topic = 'phm/state/{{ .Tag "thing_id" }}'
  layout = "non-batch"
  data_format = "json"
  json_timestamp_units = "1us"
  json_transformation = '''
    (
      $f := fields;
      $status := tags.feature_id = "controller"
        ? {"mode": $f.mode, "faultCodes": [$filter($keys($f), function($k) { $k != "mode" and $lookup($f, $k) = true })]}
        : $f;
      {
        "topic": $replace(tags.thing_id, ":", "/") & "/things/twin/commands/merge",
        "headers": {"content-type": "application/merge-patch+json", "response-required": false},
        "path": "/features",
        "value": {tags.feature_id: {"properties": {"status": $status}}}
      }
    )
  '''
